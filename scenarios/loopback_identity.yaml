name: loopback_identity
description: >
  Single-modem loopback with a transparent channel: no delay, no gain,
  no path loss, no noise, no multipath. If TX and RX WAVs don't correlate
  in this scenario, the fault is in the host pipeline or transport rather
  than the channel DSP.

environment:
  sound_speed_m_s: 1500.0
  saltwater: true
  spreading_model: spherical

transducers:
  T-001:
    tvr_db: 152.0     # placeholder mid-band transducer
    rvr_db: -180.0

modems:
  - id: modem_a
    usb_serial: "OA-2-1"
    transducer_id: "T-001"
    clock_offset_ppm: 0.0

channels:
  - from: modem_a
    to: modem_a
    range_m: 1         # near-zero range
    # Cancel the residual chain gain (voltage anchors + attenuation un-do
    # + TVR/RVR) so the loopback is a true identity passthrough. Adjust if
    # the transducer placeholder is updated.
    gain_db: -75.0
    multipath_taps:
      - delay_s: 0.0
        gain_db: 0.0
        phase_deg: 0.0

noise:
  disable: true                # transparent loopback: no ambient noise

logging:
  log_raw_tx: true
  log_raw_rx: true
  log_processed: true
  output_directory: "logs"
  file_format: wav
